<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Sports | Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --black: #0a0a0a;
            --dark-gray: #151515;
            --vibe-neon: #ccff00;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Inter', sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        header { padding: 15px 0; background: #000; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .nav-bar { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; font-size: 24px; font-style: italic; cursor: pointer; color: white; text-decoration: none; }
        .logo span { color: var(--vibe-neon); }
        .btn-adm { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* PAINEL ADM */
        #admin-panel { display: none; background: #111; padding: 25px; border-radius: 15px; margin: 20px 0; border: 1px solid var(--vibe-neon); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--vibe-neon); }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; }
        .btn-save { background: var(--vibe-neon); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }

        /* FILTROS */
        .categories { display: flex; gap: 10px; margin: 30px 0; overflow-x: auto; padding-bottom: 10px; }
        .cat-btn { background: var(--dark-gray); color: white; border: 1px solid #333; padding: 12px 25px; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn.active { background: var(--vibe-neon); color: black; border-color: var(--vibe-neon); }

        /* GRID PRODUTOS */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .product-card { background: var(--dark-gray); border-radius: 15px; overflow: hidden; border: 1px solid #222; position: relative; }
        .product-img { width: 100%; height: 320px; object-fit: cover; background: #222; }
        .product-info { padding: 20px; }
        .price { color: var(--vibe-neon); font-size: 24px; font-weight: 900; margin: 10px 0; }
        .category-tag { font-size: 11px; color: #888; text-transform: uppercase; }

        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25d366; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .delete-btn { background: #ff3333; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }

        .float-insta { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="container nav-bar">
            <a href="#" class="logo" onclick="location.reload()">VIBE <span>SPORTS</span></a>
            <button class="btn-adm" id="btnAdmOpen">ADM <i class="fa-solid fa-lock"></i></button>
        </div>
    </header>

    <main class="container">
        <section id="admin-panel">
            <h2 style="margin-bottom: 20px;">Gerenciar Catálogo</h2>
            <div class="form-group"><label>Nome</label><input type="text" id="prod-nome"></div>
            <div class="form-group"><label>Preço</label><input type="text" id="prod-preco"></div>
            <div class="form-group"><label>URL Imagem</label><input type="text" id="prod-img"></div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="prod-cat">
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Chuteiras">Chuteiras</option>
                    <option value="Bolas">Bolas</option>
                    <option value="Acessórios">Acessórios</option>
                </select>
            </div>
            <button class="btn-save" id="btnSalvar">ADICIONAR PRODUTO</button>
        </section>

        <div class="categories" id="filterBar">
            <button class="cat-btn active" data-cat="Todos">Todos</button>
            <button class="cat-btn" data-cat="Masculino">Masculino</button>
            <button class="cat-btn" data-cat="Feminino">Feminino</button>
            <button class="cat-btn" data-cat="Chuteiras">Chuteiras</button>
            <button class="cat-btn" data-cat="Bolas">Bolas</button>
            <button class="cat-btn" data-cat="Acessórios">Acessórios</button>
        </div>

        <div class="product-grid" id="catalog"></div>
    </main>

    <a href="https://www.instagram.com/vibesports_lagoacu/" target="_blank" class="float-insta"><i class="fab fa-instagram"></i></a>

    <script>
        // CONFIGURAÇÕES
        const WHATS_APP = "5599999999999"; 
        const PASS_ADM = "Vibe26";

        // PRODUTOS PADRÃO (Caso o catálogo suma, eles voltam)
        const base = [
            { id: 1, nome: "Bola Nike Skills", preco: "159,90", cat: "Bolas", img: "https://images.unsplash.com/photo-1614632537190-23e414dcb339?q=80&w=500" },
            { id: 2, nome: "Chuteira Adidas Speed", preco: "299,90", cat: "Chuteiras", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500" },
            { id: 3, nome: "Camisa Masculina Vibe", preco: "119,90", cat: "Masculino", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=500" },
            { id: 4, nome: "Camisa Feminina Vibe", preco: "119,90", cat: "Feminino", img: "https://images.unsplash.com/photo-1551854323-9420df56b515?q=80&w=500" },
            { id: 5, nome: "Mochila Esportiva", preco: "85,00", cat: "Acessórios", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=500" }
        ];

        let db = JSON.parse(localStorage.getItem('vibe_v5')) || base;
        let isAdmin = false;

        // FUNÇÃO DE RENDERIZAÇÃO
        function draw(filtro = "Todos") {
            const list = document.getElementById('catalog');
            list.innerHTML = "";
            
            const filtered = filtro === "Todos" ? db : db.filter(p => p.cat === filtro);

            filtered.forEach(p => {
                const link = `https://wa.me/${WHATS_APP}?text=Quero saber sobre: ${p.nome}`;
                list.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Vibe+Sports'">
                        <div class="product-info">
                            <span class="category-tag">${p.cat}</span>
                            <h3>${p.nome}</h3>
                            <p class="price">R$ ${p.preco}</p>
                            ${isAdmin ? `<button class="delete-btn" onclick="removeItem(${p.id})">REMOVER</button>` 
                                      : `<a href="${link}" target="_blank" class="btn-whatsapp"><i class="fab fa-whatsapp"></i> COMPRAR</a>`}
                        </div>
                    </div>
                `;
            });
        }

        // EVENTOS DE BOTÕES
        document.getElementById('btnAdmOpen').addEventListener('click', () => {
            if(isAdmin) {
                isAdmin = false;
                document.getElementById('admin-panel').style.display = 'none';
                draw();
            } else {
                const pass = prompt("Senha ADM:");
                if(pass === PASS_ADM) {
                    isAdmin = true;
                    document.getElementById('admin-panel').style.display = 'block';
                    draw();
                } else { alert("Senha Errada!"); }
            }
        });

        document.getElementById('btnSalvar').addEventListener('click', () => {
            const n = document.getElementById('prod-nome').value;
            const p = document.getElementById('prod-preco').value;
            const i = document.getElementById('prod-img').value;
            const c = document.getElementById('prod-cat').value;

            if(!n || !p || !i) return alert("Preencha tudo!");

            db.unshift({ id: Date.now(), nome: n, preco: p, img: i, cat: c });
            localStorage.setItem('vibe_v5', JSON.stringify(db));
            draw();
            alert("Salvo!");
        });

        window.removeItem = (id) => {
            db = db.filter(x => x.id !== id);
            localStorage.setItem('vibe_v5', JSON.stringify(db));
            draw();
        };

        // FILTROS
        document.getElementById('filterBar').addEventListener('click', (e) => {
            if(e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                draw(e.target.getAttribute('data-cat'));
            }
        });

        // INICIAR
        window.onload = () => draw();
    </script>
</body>
</html>
